[project]
name = "savdogar-backend"
version = "1.0.0"
description = "SmartPOS CRM API - FastAPI Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn>=0.24.0",
    "mangum>=0.17.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.12.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "openai>=1.0.0",
    "pillow>=10.0.0",
    "supabase>=2.0.0",
    "httpx>=0.25.0",
    "redis>=5.0.0",
    "qrcode>=7.0",
    "rapidfuzz>=3.0.0",
    "tenacity>=8.0.0",
    "openpyxl>=3.1.2",
    "reportlab>=4.0.0",
    "python-dateutil>=2.8.0",
    "duckduckgo-search>=4.0.0",
]

[tool.vercel]
# Vercel configuration
buildCommand = ""
outputDirectory = "."
